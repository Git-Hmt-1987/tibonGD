; assets/skin.cfg  --  TUY CHON. Khong co file / khong co muc nao thi game dung mac dinh ghi o duoi.
; Sua so roi chay lai game (khong can build). Comment phai nam tren dong rieng (bat dau bang ;).
; Luu y: file nay duoc dong goi khi export web (export_presets.cfg -> include_filter).

[colors]
; Mau dat ten. Dang "#rrggbb". Bo dau ; o dau dong de dung.
; === GIAO DIEN SANG: 1 bien mau xanh chu dao. Doi o day (bo dau ;) hoac sua hang ACCENT trong skin/UiTheme.gd ===
; accent="#2f58a8"
; body="#f3e7c8"    ; nen than panel (trang kem dam)
; ink="#27304d"     ; mau chu chinh
; header_line="#8090c8"

[fonts]
; Co chu mac dinh toan UI (0 = de Godot tu chon). Ap dung khi co/khong co font rieng.
size=0

; ---------------------------------------------------------------------------
; 9-SLICE: anh khung giang duoc. margin = so px GIU NGUYEN o moi canh anh.
;   margin (tat ca canh) hoac margin_left / margin_top / margin_right / margin_bottom
;   content = le chu ben trong (mac dinh = margin)
;   tint = nhan mau ("#rrggbb"), tile = true -> lap hoa van thay vi keo gian
; Mac dinh neu khong khai bao: panel 8, button 6, bar 2, slot 4.
; ---------------------------------------------------------------------------
[panel.panel]
margin=8

[panel.login]
margin=12

[panel.tooltip]
margin=6

[button.button]
margin=6

[button.icon]
margin=6

[button.fight]
margin=6

[slot]
margin=4

[bar.hp]
margin=2
margin_left=9
margin_right=9
margin_top=0
margin_bottom=0

[bar.mana]
margin=2
margin_left=9
margin_right=9
margin_top=0
margin_bottom=0

[bar.stamina]
margin=2
margin_left=9
margin_right=9
margin_top=0
margin_bottom=0

[bar.exp]
margin=2
margin_left=9
margin_right=9
margin_top=0
margin_bottom=0

[bar.target]
margin=2
margin_left=9
margin_right=9
margin_top=0
margin_bottom=0

; ---------------------------------------------------------------------------
; HIEU UNG (assets/fx/...): khung vuong = chieu cao anh; cac khung xep trai->phai, tren->duoi.
; Khai bao [fx.<thu muc>.<ten>] chi khi khac mac dinh. Cac khoa:
;   frame_w, frame_h : kich thuoc 1 khung (px)          mac dinh frame_h = cao anh, frame_w = frame_h
;   frames           : tong so khung                    mac dinh = so cot x so hang
;   fps              : khung/giay                       mac dinh 14
;   loop             : true = lap lai                   mac dinh: dan bay = true, hieu ung o = false
;   size             : chieu cao ve ra, tinh theo o     mac dinh 1.0 (= 1 o). 2.0 = to gap doi
;   offset_y         : dich doc theo o (am = len tren)  mac dinh 0
; Vi du (bo dau ; de dung):
; [fx.me.magic_blue]
; fps=10
; size=1.5
; [fx.element.fire_shot]
; frames=4
; fps=20
; ---------------------------------------------------------------------------
