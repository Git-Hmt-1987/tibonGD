# Build client Godot -> Web và đăng lên GitHub Pages mỗi lần push vào main (hoặc bấm Run workflow).
# CHÚ Ý: Pages của repo PRIVATE cần gói GitHub trả phí. Nếu không có, xem HUONG_DAN_WEB.md (xuất tay + Cloudflare Pages/Netlify/Vercel).
name: web
on:
  push:
    branches: [main]
    paths: ["godot_client/**", ".github/workflows/web.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
env:
  GODOT_VERSION: "4.7"      # khớp config/features trong project.godot; nếu tải lỗi 404, đổi sang bản có thật trên github.com/godotengine/godot-builds/releases
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cài Godot + export templates
        run: |
          set -e
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o tpl.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot && chmod +x /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q tpl.tpz -d /tmp/tpl && mv /tmp/tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
      - name: Export Web
        run: |
          mkdir -p web_export
          cd godot_client
          godot --headless --import || true
          godot --headless --export-release "Web" ../web_export/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web_export
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
